# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action#configuration-options

# Fail on high severity vulnerabilities
fail-on-severity: high

# Allow specific vulnerabilities that are false positives or not exploitable
allow-ghsas:
  # Example: GHSA-xxxx-xxxx-xxxx

# Deny specific licenses
deny-licenses:
  - GPL-3.0-only
  - AGPL-3.0-only

# Allow specific licenses
# allow-licenses:
#   - MIT
#   - Apache-2.0
#   - BSD-3-Clause

# Scope to check (dependencies, devDependencies, or all)
scope: all