name: Mage Knight CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # --- Shared setup for all jobs ---
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  # --- Lint & TypeCheck (fast, parallel) ---
  lint-typecheck:
    name: Lint & TypeCheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Lint
        run: npm run lint
      - name: TypeCheck
        run: npm run typecheck

  # --- Unit Tests mit Coverage ---
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Run Tests
        run: npm run test:coverage
      - name: Coverage Gate (80% thresholds)
        if: always()
        run: |
          echo "Checking coverage thresholds from coverage report..."
          node << 'EOF'
            const fs = require('fs');
            const path = require('path');
            const coverageDir = path.join(process.cwd(), 'coverage');
            
            // Debug: list all files in coverage directory
            console.log('Coverage directory:', coverageDir);
            if (!fs.existsSync(coverageDir)) {
              console.error('Coverage directory does not exist!');
              process.exit(1);
            }
            
            const files = fs.readdirSync(coverageDir);
            console.log('Files in coverage dir:', files);
            
            // Look for any JSON file (could be coverage-final.json, coverage.json, etc.)
            const jsonFiles = files.filter(f => f.endsWith('.json'));
            console.log('JSON files found:', jsonFiles);
            
            if (jsonFiles.length === 0) {
              console.error('No coverage JSON files found!');
              process.exit(1);
            }
            
            // Try each JSON file until we find one with coverage data
            let coverage = null;
            for (const jsonFile of jsonFiles) {
              try {
                const content = fs.readFileSync(path.join(coverageDir, jsonFile), 'utf8');
                const data = JSON.parse(content);
                // v8 coverage format: flat object with file paths as keys
                // Check if it has file coverage data (has statementMap or functionMap)
                const keys = Object.keys(data);
                if (keys.length > 0 && keys[0].includes('.ts') || keys[0].includes('.js')) {
                  coverage = data;
                  console.log('Using coverage file:', jsonFile);
                  break;
                }
                // Also check for standard format (total/files properties)
                if (data && (data.total || data.files)) {
                  coverage = data;
                  console.log('Using coverage file:', jsonFile);
                  break;
                }
              } catch (e) {
                console.log('Failed to parse:', jsonFile, e.message);
              }
            }

            if (!coverage) {
              console.error('No valid coverage data found in any JSON file!');
              process.exit(1);
            }

            // Compute totals from v8 coverage format
            const totals = { statements: 0, branches: 0, functions: 0, lines: 0 };
            const covered = { statements: 0, branches: 0, functions: 0, lines: 0 };
            
            for (const [file, fileData] of Object.entries(coverage)) {
              if (!fileData || typeof fileData !== 'object') continue;
              
              // v8 format: statementMap, branchMap, functionMap, s (statement counts), b (branch counts), f (function counts)
              if (fileData.statementMap && fileData.s) {
                for (const [_, count] of Object.entries(fileData.s)) {
                  totals.statements++;
                  if (count > 0) covered.statements++;
                }
              }
              if (fileData.branchMap && fileData.b) {
                for (const branches of Object.values(fileData.b)) {
                  for (const count of branches) {
                    totals.branches++;
                    if (count > 0) covered.branches++;
                  }
                }
              }
              if (fileData.fnMap && fileData.f) {
                for (const [_, count] of Object.entries(fileData.f)) {
                  totals.functions++;
                  if (count > 0) covered.functions++;
                }
              }
              // For lines, use statementMap as proxy
              if (fileData.statementMap && fileData.s) {
                for (const [_, count] of Object.entries(fileData.s)) {
                  totals.lines++;
                  if (count > 0) covered.lines++;
                }
              }
            }

            // Also check if it's the standard format (total property)
            if (coverage.total) {
              for (const key of ['statements', 'branches', 'functions', 'lines']) {
                totals[key] = coverage.total[key]?.total || totals[key];
                covered[key] = coverage.total[key]?.covered || covered[key];
              }
            }

            const thresholds = { statements: 80, branches: 80, functions: 80, lines: 80 };
            let failed = false;
            for (const [key, threshold] of Object.entries(thresholds)) {
              const total = totals[key] || 0;
              const cov = covered[key] || 0;
              const pct = total > 0 ? Math.round((cov / total) * 100) : 0;
              if (pct < threshold) {
                console.error(`FAIL: ${key} ${pct}% < ${threshold}%`);
                failed = true;
              } else {
                console.log(`OK: ${key} ${pct}% >= ${threshold}%`);
              }
            }
            if (failed) {
              process.exit(1);
            }
          EOF
      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: ./coverage/
          fail_ci_if_error: false
          flags: unittests

  # --- E2E Tests (Playwright) ---
  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: npx playwright test --project=chromium
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --- Build & Lighthouse (nur bei Push/Merge) ---
  build:
    name: Build & Lighthouse
    needs: [lint-typecheck, test, e2e]
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Build
        run: npm run build
      - name: Check Bundle Size
        run: |
          echo "=== Bundle Size Report ==="
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
          echo ""
          echo "=== Total JS Size (gzipped) ==="
          find dist -name "*.js" -exec gzip -c {} \; | wc -c | awk '{print "JS gzipped: " $1/1024 " KB"}'
          echo ""
          echo "=== Checking against limits ==="
          JS_SIZE=$(find dist -name "*.js" -exec gzip -c {} \; | wc -c)
          if [ $JS_SIZE -gt 512000 ]; then
            echo "❌ JS bundle exceeds 500KB limit: $(($JS_SIZE/1024)) KB"
            exit 1
          else
            echo "✅ JS bundle OK: $(($JS_SIZE/1024)) KB / 500 KB"
          fi
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true

  # --- Deploy to GitHub Pages ---
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  # --- Optional: Security Audit ---
  security:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: npm audit
        run: npm audit --audit-level=high || true

  # --- Dependency Review ---
  deps:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
