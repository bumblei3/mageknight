name: Mage Knight CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_lighthouse:
        description: 'Run Lighthouse CI'
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # --- Shared Setup Job ---
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit
      - uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  # --- Lint & TypeCheck (fast, parallel) ---
  lint-typecheck:
    name: Lint & TypeCheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Lint
        run: npm run lint
      - name: TypeCheck
        run: npm run typecheck

  # --- Unit Tests mit Coverage ---
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Run Tests with Coverage
        run: npm run test:coverage
      - name: Coverage Gate (80% thresholds)
        run: |
          echo "Coverage thresholds enforced by vitest (check-coverage: true in package.json)"
      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage/
          fail_ci_if_error: false
          flags: unittests

  # --- E2E Tests (Playwright) - Chromium Only ---
  e2e:
    name: E2E Tests (chromium)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: npx playwright test --project=chromium
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7

  # --- Build & Lighthouse ---
  build:
    name: Build & Lighthouse
    needs: [lint-typecheck, test, e2e]
    if: github.event_name == 'push' || github.event.pull_request.merged == true || github.event.inputs.run_lighthouse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Build
        run: npm run build
      - name: Check Bundle Size
        run: |
          echo "=== Bundle Size Report ==="
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
          echo ""
          echo "=== Total JS Size (gzipped) ==="
          find dist -name "*.js" -exec gzip -c {} \; | wc -c | awk '{print "JS gzipped: " $1/1024 " KB"}'
          echo ""
          echo "=== Checking against limits ==="
          JS_SIZE=$(find dist -name "*.js" -exec gzip -c {} \; | wc -c)
          if [ $JS_SIZE -gt 512000 ]; then
            echo "❌ JS bundle exceeds 500KB limit: $(($JS_SIZE/1024)) KB"
            exit 1
          else
            echo "✅ JS bundle OK: $(($JS_SIZE/1024)) KB / 500 KB"
          fi
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Lighthouse CI
        if: github.event.inputs.run_lighthouse == 'true' || github.event_name == 'push'
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true

  # --- PR Preview Deployment ---
  deploy-preview:
    name: Deploy PR Preview
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Pages Preview
        if: env.CF_PAGES_TOKEN != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: mageknight-preview
          directory: dist
          branch: preview-${{ github.event.number }}
        env:
          CF_PAGES_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # --- Deploy to GitHub Pages ---
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  # --- Optional: Security Audit ---
  security:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: npm audit (high+)
        run: npm audit --audit-level=high --json > audit-report.json || true
      - name: Summarize Vulnerabilities
        run: |
          if [ -f audit-report.json ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-report.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-report.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-report.json)
            LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-report.json)
            echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "⚠️ High/Critical vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      - name: Upload Audit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-audit
          path: audit-report.json
          retention-days: 7

  # --- Dependency Review ---
  deps:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          config-file: '.github/dependency-review-config.yml'