name: Mage Knight CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # --- Shared setup for all jobs ---
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

  # --- Lint & TypeCheck (fast, parallel) ---
  lint-typecheck:
    name: Lint & TypeCheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Lint
        run: npm run lint
      - name: TypeCheck
        run: npm run typecheck

  # --- Unit Tests mit Coverage ---
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Run Tests
        run: npm run test:coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: ./coverage/
          fail_ci_if_error: false
          flags: unittests

  # --- E2E Tests (Playwright) ---
  e2e:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true  # Playwright Chromium not supported on Ubuntu 26.04 yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Playwright Dependencies
        run: |
          # Try to install Chromium - may fail on Ubuntu 26.04
          npx playwright install --with-deps chromium 2>&1 || true
          # Verify if chromium is available
          if [ -f ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome ]; then
            echo "PLAYWRIGHT_CHROMIUM_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "PLAYWRIGHT_CHROMIUM_AVAILABLE=false" >> $GITHUB_ENV
            echo "⚠️ Chromium not available on this platform, skipping E2E tests"
          fi
      - name: Run E2E Tests
        if: env.PLAYWRIGHT_CHROMIUM_AVAILABLE == 'true'
        run: npx playwright test
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Skip E2E Tests
        if: env.PLAYWRIGHT_CHROMIUM_AVAILABLE == 'false'
        run: echo "Skipping E2E tests - Chromium not supported on this platform"
      - name: Upload Playwright Report
        if: always() && env.PLAYWRIGHT_CHROMIUM_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --- Build & Lighthouse (nur bei Push/Merge) ---
  build:
    name: Build & Lighthouse
    needs: [lint-typecheck, test, e2e]
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Build
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true

  # --- Deploy to GitHub Pages ---
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  # --- Optional: Security Audit ---
  security:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: npm audit
        run: npm audit --audit-level=high || true

  # --- Dependency Review ---
  deps:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
